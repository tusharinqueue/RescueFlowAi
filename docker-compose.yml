version: "3.9"

services:
  # ──────────────────────────────────────────────────────────────────────────
  #  Frontend – Next.js 14
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: rescueflowai_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    networks:
      - rescueflow_net

  # ──────────────────────────────────────────────────────────────────────────
  #  Backend – FastAPI
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: rescueflowai_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - APP_ENV=development
    env_file:
      - ./backend/.env
    networks:
      - rescueflow_net
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

networks:
  rescueflow_net:
    driver: bridge
